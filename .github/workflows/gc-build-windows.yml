name: GC Build Windows

# Windows x64 Flutter build for the GameCaste fork.
# Produces the ./rustdesk run-in-place folder (the built client + dlls) and the
# MSI made from it, each as an artifact. Manual trigger only (a full build is
# ~30-40 min). Dispatch against gc/base to get a build with the baked server
# config.
#
# Trimmed from upstream flutter-build.yml: x64 only; no signing,
# self-extractor, publish, tests, printer driver or RustDeskTempTopMostWindow.

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Build edition (club = hidden host / incoming; admin = windowed / outgoing)"
        type: choice
        options:
          - club
          - admin
        default: club
      portable_run_id:
        description: "Only repackage: id of an earlier run of this workflow whose portable folder (same edition) goes into the MSI"
        type: string
        default: ""

jobs:
  generate-bridge:
    if: ${{ inputs.portable_run_id == '' }}
    runs-on: ubuntu-22.04
    env:
      CARGO_EXPAND_VERSION: "1.0.95"
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      RUST_VERSION: "1.75"
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-ubuntu-22.04

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-3.22.3

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.22.3"
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows-x64:
    name: windows x64 portable (flutter)
    needs: [generate-bridge]
    if: ${{ inputs.portable_run_id == '' }}
    runs-on: windows-2022
    env:
      FLUTTER_VERSION: "3.24.5"
      LLVM_VERSION: "15.0.6"
      RUST_VERSION: "1.75"
      VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VERSION: "1.5.1"
      GAMECASTE_EDITION: ${{ inputs.edition }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-${{ inputs.edition }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; echo "======"; cat "$_1"; echo "======"; echo ""
            done
            exit 1
          fi

      - name: Build rustdesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          # The in-app installer copies this folder as is and then starts "<app name>.exe"
          # (src/platform/windows.rs get_install_info), so the exe must carry the app name
          # (src/common.rs gamecaste_app_name).
          $appName = if ("${{ inputs.edition }}" -eq "admin") { "GamecasteRemote" } else { "GamecasteRemoteHost" }
          Rename-Item ./rustdesk/rustdesk.exe "$appName.exe"

          # Virtual display driver (small; feature degrades gracefully without it)
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Upload portable client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamecaste-remote-windows-x64-portable-${{ inputs.edition }}
          path: rustdesk
          if-no-files-found: error

  package-msi:
    name: windows x64 msi
    needs: [build-windows-x64]
    # After a fresh build, or alone on the portable folder of an earlier run.
    if: ${{ !cancelled() && (needs.build-windows-x64.result == 'success' || inputs.portable_run_id != '') }}
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read
    env:
      APP_NAME: ${{ inputs.edition == 'admin' && 'GamecasteRemote' || 'GamecasteRemoteHost' }}
      # The club-only parts of res/msi/Package/Components/Gamecaste.wxs key on "incoming".
      CONN_TYPE: ${{ inputs.edition == 'admin' && 'outgoing' || 'incoming' }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download the portable client of this run
        if: ${{ inputs.portable_run_id == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamecaste-remote-windows-x64-portable-${{ inputs.edition }}
          path: rustdesk

      - name: Download the portable client of an earlier run
        if: ${{ inputs.portable_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gamecaste-remote-windows-x64-portable-${{ inputs.edition }}
          path: rustdesk
          run-id: ${{ inputs.portable_run_id }}
          github-token: ${{ github.token }}

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Prepare msi sources
        # bash, so that the JSON reaches python with its quotes
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cd res/msi
          python preprocess.py -d ../../rustdesk \
            --app-name "$APP_NAME" --conn-type "$CONN_TYPE" --manufacturer GameCaste \
            --custom-arp '{"Contact":{"msi":"ARPCONTACT","v":"https://github.com/it-entegra/gamecaste_remote"},"HelpLink":{"msi":"ARPHELPLINK","v":"https://github.com/it-entegra/gamecaste_remote/issues"},"ReadMe":{"msi":"ARPREADME","v":"https://github.com/it-entegra/gamecaste_remote"}}'

      - name: Build msi
        run: |
          pushd ./res/msi
          nuget restore msi.sln
          if ($LASTEXITCODE -ne 0) { throw "nuget restore exited with $LASTEXITCODE" }
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          if ($LASTEXITCODE -ne 0) { throw "msbuild exited with $LASTEXITCODE" }
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          popd
          if (-not $msi) { throw "Package.msi was not built" }

          $version = (& "./rustdesk/$($env:APP_NAME).exe" --version | Out-String).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Unexpected version '$version'" }
          $name = "$($env:APP_NAME)-$version-x64.msi"
          New-Item -ItemType Directory -Force ./msi | Out-Null
          Move-Item $msi.FullName "./msi/$name"

          # What whoever bundles or updates the client needs to know about the package.
          $upgradeCode = (Select-String -Path ./res/msi/Package/Includes.wxi -Pattern 'UpgradeCode = "([^"]+)"').Matches.Groups[1].Value
          $file = Get-Item "./msi/$name"
          $lines = @(
            "| | |",
            "|---|---|",
            "| file | $name |",
            "| size | $($file.Length) |",
            "| sha256 | $((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()) |",
            "| sha1 | $((Get-FileHash $file.FullName -Algorithm SHA1).Hash.ToLower()) |",
            "| UpgradeCode | $upgradeCode |"
          )
          $lines | Write-Host
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gamecaste-remote-windows-x64-msi-${{ inputs.edition }}
          path: msi
          if-no-files-found: error
